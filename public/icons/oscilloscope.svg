<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .scope { animation: scope-in 3.4s cubic-bezier(.22,1,.36,1) infinite; transform-origin: 32px 32px; }
    @keyframes scope-in {
      0%, 100% { transform: rotate(-1.5deg) scale(1); }
      50% { transform: rotate(-1.5deg) scale(1.02); }
    }
    .sine { stroke-dasharray: 100; stroke-dashoffset: 100; animation: sine-draw 3.4s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes sine-draw {
      0% { stroke-dashoffset: 100; }
      55% { stroke-dashoffset: 0; }
      85% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 100; }
    }
    .led { animation: led-blink 1.6s steps(1) infinite; }
    @keyframes led-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: .25; }
    }
    .needle { animation: knob-turn 3.4s cubic-bezier(.22,1,.36,1) infinite; transform-origin: 28px 46px; }
    @keyframes knob-turn {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(20deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .scope, .sine, .led, .needle { animation: none !important; }
      .sine { stroke-dashoffset: 0; }
    }
  </style>
