<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Electrical transformer with two bushings and a pulsing lightning bolt">
  <style>
    .bolt { transform-box: fill-box; transform-origin: center; animation: bolt-pulse 1.4s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes bolt-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.22); opacity: .65; }
    }
    .needle { transform-origin: 24px 39px; animation: needle-swing 2.6s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes needle-swing {
      0%, 100% { transform: rotate(-24deg); }
      50% { transform: rotate(24deg); }
    }
    .sparkle { transform-box: fill-box; transform-origin: center; animation: sparkle 2.2s ease-in-out infinite; }
    .sparkle.s2 { animation-delay: 1.1s; }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(20deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bolt, .needle, .sparkle { animation: none; }
    }
  </style>
  <rect x="4.5" y="4.5" width="61" height="61" rx="14" fill="#221D2E"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#FFF6EC" stroke="#221D2E" stroke-width="1.5"/>
  <g transform="rotate(-2 32 32)">
    <path class="sparkle" d="M10 7.4 L11.1 9.6 L13.4 10.7 L11.1 11.8 L10 14 L8.9 11.8 L6.6 10.7 L8.9 9.6 Z" fill="#3FC7A9"/>
    <path class="sparkle s2" d="M54 5.4 L55.1 7.6 L57.4 8.7 L55.1 9.8 L54 12 L52.9 9.8 L50.6 8.7 L52.9 7.6 Z" fill="#FF5C7A"/>
    <line x1="12" y1="55" x2="52" y2="55" stroke="#221D2E" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="19" y="31" width="32" height="22" rx="4" fill="#221D2E"/>
    <rect x="16" y="28" width="32" height="22" rx="4" fill="#8B7CFF" stroke="#221D2E" stroke-width="2"/>
    <rect x="22.5" y="13" width="3" height="15" fill="#FFFFFF" stroke="#221D2E" stroke-width="1.5"/>
    <ellipse cx="24" cy="16.5" rx="4" ry="1.6" fill="#FFFFFF" stroke="#221D2E" stroke-width="1.5"/>
    <ellipse cx="24" cy="20" rx="5" ry="1.8" fill="#FFFFFF" stroke="#221D2E" stroke-width="1.5"/>
    <ellipse cx="24" cy="23.5" rx="6" ry="2" fill="#FFFFFF" stroke="#221D2E" stroke-width="1.5"/>
    <circle cx="24" cy="12" r="2.2" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5"/>
    <rect x="38.5" y="13" width="3" height="15" fill="#FFFFFF" stroke="#221D2E" stroke-width="1.5"/>
    <ellipse cx="40" cy="16.5" rx="4" ry="1.6" fill="#FFFFFF" stroke="#221D2E" stroke-width="1.5"/>
    <ellipse cx="40" cy="20" rx="5" ry="1.8" fill="#FFFFFF" stroke="#221D2E" stroke-width="1.5"/>
    <ellipse cx="40" cy="23.5" rx="6" ry="2" fill="#FFFFFF" stroke="#221D2E" stroke-width="1.5"/>
    <circle cx="40" cy="12" r="2.2" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5"/>
    <circle cx="24" cy="39" r="5" fill="#FFF6EC" stroke="#221D2E" stroke-width="1.5"/>
    <line class="needle" x1="24" y1="39" x2="24" y2="35.5" stroke="#FF5C7A" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="24" cy="39" r="1.2" fill="#221D2E"/>
    <line x1="36" y1="35" x2="44" y2="35" stroke="#221D2E" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="39" x2="44" y2="39" stroke="#221D2E" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="43" x2="44" y2="43" stroke="#221D2E" stroke-width="1.5" stroke-linecap="round"/>
    <g class="bolt">
      <path d="M34 4.5 L28.5 12.5 L31.5 12.5 L30 20 L35.5 9.5 L32.5 9.5 Z" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
