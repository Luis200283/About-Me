<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Analog voltmeter gauge with swinging needle">
  <style>
    .needle { transform-box: view-box; transform-origin: 32px 34px; animation: needle-swing 2.6s cubic-bezier(.22,1,.36,1) infinite; }
    .red-zone { animation: zone-pulse 2.6s ease-in-out infinite; }
    @keyframes needle-swing {
      0%, 100% { transform: rotate(-32deg); }
      50% { transform: rotate(26deg); }
    }
    @keyframes zone-pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }
    @media (prefers-reduced-motion: reduce) {
      .needle, .red-zone { animation: none; }
    }
  </style>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#FFF6EC" stroke="#221D2E" stroke-width="1.5"/>
  <circle cx="35" cy="37" r="25" fill="#221D2E"/>
  <circle cx="32" cy="34" r="25" fill="#FFFFFF" stroke="#221D2E" stroke-width="2"/>
  <path d="M 9 34 A 23 23 0 0 1 55 34" fill="none" stroke="#221D2E" stroke-width="1.5"/>
  <path d="M 9 34 A 23 23 0 0 1 15.74 17.74" fill="none" stroke="#3FC7A9" stroke-width="3.5"/>
  <path class="red-zone" d="M 48.26 17.74 A 23 23 0 0 1 55 34" fill="none" stroke="#FF5C7A" stroke-width="3.5"/>
  <g stroke="#221D2E" stroke-width="2" stroke-linecap="round">
    <line x1="13" y1="34" x2="9" y2="34"/>
    <line x1="18.57" y1="20.57" x2="15.74" y2="17.74"/>
    <line x1="32" y1="15" x2="32" y2="11"/>
    <line x1="45.43" y1="20.57" x2="48.26" y2="17.74"/>
    <line x1="51" y1="34" x2="55" y2="34"/>
  </g>
  <g stroke="#221D2E" stroke-width="1.5" stroke-linecap="round">
    <line x1="13.06" y1="26.15" x2="10.75" y2="25.19"/>
    <line x1="24.15" y1="15.06" x2="23.19" y2="12.75"/>
    <line x1="39.85" y1="15.06" x2="40.81" y2="12.75"/>
    <line x1="50.94" y1="26.15" x2="53.25" y2="25.19"/>
  </g>
  <g class="needle">
    <line x1="32" y1="34" x2="32" y2="17" stroke="#FF5C7A" stroke-width="3" stroke-linecap="round"/>
  </g>
  <circle cx="32" cy="34" r="3" fill="#221D2E"/>
  <circle cx="32" cy="34" r="1.2" fill="#FFF6EC"/>
  <path d="M 33.5 42 L 30 47 L 32.5 47 L 31 52 L 35.5 45.5 L 33 45.5 L 34.5 42 Z" fill="#FFC95C" stroke="#221D2E" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
