<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .chip-g { animation: chip-breathe 3s cubic-bezier(.22,1,.36,1) infinite; transform-origin: 32px 32px; }
    @keyframes chip-breathe {
      0%,100% { transform: scale(1) rotate(-2deg); }
      50% { transform: scale(1.03) rotate(-2deg); }
    }
    .led { animation: led-blink 1.4s steps(1) infinite; }
    .l1 { animation-delay: 0s; }
    .l2 { animation-delay: .25s; }
    .l3 { animation-delay: .5s; }
    .l4 { animation-delay: .75s; }
    .l5 { animation-delay: 1s; }
    .l6 { animation-delay: .35s; }
    .l7 { animation-delay: .65s; }
    .l8 { animation-delay: .95s; }
    @keyframes led-blink {
      0%,100% { opacity: 1; }
      50% { opacity: .2; }
    }
    .pulse { animation: pulse-run 3s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes pulse-run {
      0% { opacity: 0; transform: translate(16px, 32px) scale(.5); }
      10% { opacity: 1; }
      50% { transform: translate(32px, 32px) scale(1); }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translate(48px, 32px) scale(.5); }
    }
    .pin-pulse { animation: pin-travel 3s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes pin-travel {
      0% { opacity: 0; transform: translateX(0); }
      10% { opacity: 1; }
      50% { transform: translateX(24px); }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translateX(48px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .chip-g, .led, .pulse, .pin-pulse { animation: none !important; }
      .pulse, .pin-pulse { opacity: .6; }
    }
  </style>
  <g class="chip-g">
    <rect x="18" y="18" width="28" height="28" rx="6" fill="#221D2E"/>
    <rect x="21" y="21" width="22" height="22" rx="4" fill="#8B7CFF" stroke="#221D2E" stroke-width="1.5"/>
    <text x="32" y="36" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#FFF6EC">MCU</text>
  </g>
  <rect class="pulse" x="28" y="28" width="8" height="8" rx="2" fill="#FFC95C" stroke="#221D2E" stroke-width="1"/>
  <g stroke="#221D2E" stroke-width="1.5" stroke-linecap="round">
    <line x1="8" y1="22" x2="16" y2="22"/>
    <line x1="8" y1="32" x2="16" y2="32"/>
    <line x1="8" y1="42" x2="16" y2="42"/>
    <line x1="48" y1="22" x2="56" y2="22"/>
    <line x1="48" y1="32" x2="56" y2="32"/>
    <line x1="48" y1="42" x2="56" y2="42"/>
    <line x1="22" y1="8" x2="22" y2="16"/>
    <line x1="32" y1="8" x2="32" y2="16"/>
    <line x1="42" y1="8" x2="42" y2="16"/>
    <line x1="22" y1="48" x2="22" y2="56"/>
    <line x1="32" y1="48" x2="32" y2="56"/>
    <line x1="42" y1="48" x2="42" y2="56"/>
  </g>
  <g stroke="#221D2E" stroke-width="1">
    <circle class="led l1" cx="6" cy="22" r="2" fill="#3FC7A9"/>
    <circle class="led l2" cx="58" cy="22" r="2" fill="#FF5C7A"/>
    <circle class="led l3" cx="6" cy="42" r="2" fill="#FFC95C"/>
    <circle class="led l4" cx="58" cy="42" r="2" fill="#3FC7A9"/>
    <circle class="led l5" cx="22" cy="6" r="2" fill="#FF5C7A"/>
    <circle class="led l6" cx="42" cy="6" r="2" fill="#3FC7A9"/>
    <circle class="led l7" cx="22" cy="58" r="2" fill="#FFC95C"/>
    <circle class="led l8" cx="42" cy="58" r="2" fill="#FF5C7A"/>
  </g>
  <g class="pin-pulse" stroke="#FFC95C" stroke-width="1.5" stroke-linecap="round" fill="none">
    <path d="M22 4h20"/>
    <path d="M22 60h20"/>
    <path d="M4 22v20"/>
    <path d="M60 22v20"/>
  </g>
</svg>
