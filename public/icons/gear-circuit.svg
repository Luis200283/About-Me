<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    .gear-spin { animation: gear-rotate 12s linear infinite; transform-origin: 32px 32px; }
    @keyframes gear-rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .pulse { animation: pulse-travel 3.2s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes pulse-travel {
      0% { transform: translate(20px, 20px); opacity: 0; }
      8% { opacity: 1; }
      25% { transform: translate(32px, 20px); }
      75% { transform: translate(32px, 44px); }
      92% { opacity: 1; }
      100% { transform: translate(44px, 44px); opacity: 0; }
    }
    .node { animation: node-glow 3.2s ease-in-out infinite; }
    @keyframes node-glow {
      0%, 100% { opacity: .6; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gear-spin, .pulse, .node { animation: none !important; }
      .pulse { opacity: .8; transform: translate(32px, 20px); }
    }
  </style>
