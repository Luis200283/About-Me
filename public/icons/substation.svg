<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Electrical substation with transformer, towers and power lines">
  <style>
    .bolt { transform-box: fill-box; transform-origin: center; animation: bolt-pulse 2s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes bolt-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: .5; }
    }
    .insulator { transform-box: fill-box; transform-origin: center; animation: ins-glow 3s ease-in-out infinite; }
    @keyframes ins-glow {
      0%, 100% { fill: #8B7CFF; }
      50% { fill: #FFC95C; }
    }
    .wire { stroke-dasharray: 6 4; animation: wire-flow 1.5s linear infinite; }
    @keyframes wire-flow {
      to { stroke-dashoffset: -20; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bolt, .insulator, .wire { animation: none; }
    }
  </style>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#FFF6EC" stroke="#221D2E" stroke-width="1.5"/>
  <line x1="6" y1="54" x2="58" y2="54" stroke="#221D2E" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#221D2E" stroke-width="1.5" stroke-linecap="round">
    <line x1="14" y1="54" x2="14" y2="26"/>
    <line x1="10" y1="30" x2="18" y2="30"/>
    <line x1="11" y1="36" x2="17" y2="36"/>
    <line x1="12" y1="42" x2="16" y2="42"/>
    <line x1="50" y1="54" x2="50" y2="26"/>
    <line x1="46" y1="30" x2="54" y2="30"/>
    <line x1="47" y1="36" x2="53" y2="36"/>
    <line x1="48" y1="42" x2="52" y2="42"/>
  </g>
  <path class="wire" d="M 14 26 Q 32 20, 50 26" fill="none" stroke="#574E63" stroke-width="1.5"/>
  <path class="wire" d="M 14 30 Q 32 36, 50 30" fill="none" stroke="#574E63" stroke-width="1.5"/>
  <path class="wire" d="M 14 36 Q 32 30, 50 36" fill="none" stroke="#574E63" stroke-width="1.5"/>
  <rect x="24" y="34" width="18" height="20" rx="4" fill="#221D2E"/>
  <rect x="21" y="31" width="18" height="20" rx="4" fill="#8B7CFF" stroke="#221D2E" stroke-width="1.5"/>
  <rect x="25" y="35" width="4" height="12" rx="1" fill="#574E63"/>
  <rect x="31" y="35" width="4" height="12" rx="1" fill="#574E63"/>
  <rect x="37" y="35" width="4" height="12" rx="1" fill="#574E63"/>
  <line x1="24" y1="31" x2="24" y2="26" stroke="#221D2E" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="31" x2="33" y2="26" stroke="#221D2E" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="31" x2="42" y2="26" stroke="#221D2E" stroke-width="2" stroke-linecap="round"/>
  <circle class="insulator" cx="24" cy="25" r="2.2" stroke="#221D2E" stroke-width="1"/>
  <circle class="insulator" cx="33" cy="25" r="2.2" stroke="#221D2E" stroke-width="1"/>
  <circle class="insulator" cx="42" cy="25" r="2.2" stroke="#221D2E" stroke-width="1"/>
  <g class="bolt">
    <path d="M 8 4 L 4 9 L 6.5 9 L 5 14 L 10 7 L 7.5 7 Z" fill="#FFC95C" stroke="#221D2E" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <path d="M 48 8 L 49.2 10.8 L 52 12 L 49.2 13.3 L 48 16 L 46.8 13.3 L 44 12 L 46.8 10.8 Z" fill="#FF5C7A" stroke="#221D2E" stroke-width="1"/>
</svg>
