<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Digital multimeter with changing readings and test leads">
  <style>
    .lead-red { transform-box: fill-box; transform-origin: center; animation: lead-wiggle 1.6s ease-in-out infinite; }
    .lead-black { transform-box: fill-box; transform-origin: center; animation: lead-wiggle 1.6s ease-in-out infinite reverse; }
    @keyframes lead-wiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    .btn { transform-box: fill-box; transform-origin: center; animation: btn-rotate 4s linear infinite; }
    @keyframes btn-rotate {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(22deg); }
    }
    .digit { opacity: 0; animation: digit-cycle 5s steps(1) infinite; }
    .digit.d2 { animation-delay: 1.25s; }
    .digit.d3 { animation-delay: 2.5s; }
    .digit.d4 { animation-delay: 3.75s; }
    @keyframes digit-cycle {
      0%, 9% { opacity: 1; }
      10%, 100% { opacity: 0; }
    }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark-pop 1.8s ease-in-out infinite; }
    @keyframes spark-pop {
      0%, 100% { opacity: 0; transform: scale(.4); }
      50% { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .lead-red, .lead-black, .btn, .digit, .spark { animation: none; }
      .digit.d1 { opacity: 1; }
    }
  </style>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#FFF6EC" stroke="#221D2E" stroke-width="1.5"/>
  <g class="lead-red">
    <path d="M 12 8 C 8 16, 14 20, 10 28" fill="none" stroke="#FF5C7A" stroke-width="2"5" stroke-linecap="round"/>
    <circle cx="10" cy="29" r="2.5" fill="#FF5C7A" stroke="#221D2E" stroke-width="1.2"/>
  </g>
  <g class="lead-black">
    <path d="M 52 8 C 56 16, 50 20, 54 28" fill="none" stroke="#221D2E" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="54" cy="29" r="2.5" fill="#221D2E"/>
  </g>
  <rect x="17" y="10" width="30" height="44" rx="14" fill="#221D2E"/>
  <rect x="14" y="7" width="30" height="44" rx="14" fill="#FFC95C" stroke="#221D2E" stroke-width="2"/>
  <rect x="21" y="14" width="18" height="12" rx="3" fill="#221D2E"/>
  <text class="digit d1" x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3FC7A9">230</text>
  <text class="digit d2" x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3FC7A9">4.7k</text>
  <text class="digit d3" x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3FC7A9">12.5</text>
  <text class="digit d4" x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3FC7A9">0.00</text>
  <circle class="btn" cx="29" cy="44" r="6" fill="#FFF6EC" stroke="#221D2E" stroke-width="1.5"/>
  <line x1="29" y1="44" x2="31" y2="40" stroke="#221D2E" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="22" cy="36" r="2" fill="#3FC7A9" stroke="#221D2E" stroke-width="1"/>
  <circle cx="36" cy="36" r="2" fill="#3FC7A9" stroke="#221D2E" stroke-width="1"/>
  <path class="spark" d="M 50 5 L 51.2 7.8 L 54 9 L 51.2 10.2 L 50 13 L 48.8 10.2 L 46 9 L 48.8 7.8 Z" fill="#FF5C7A"/>
  <path d="M 10 56 Q 16 53, 22 56 T 34 56" fill="none" stroke="#8B7CFF" stroke-width="2" stroke-linecap="round"/>
</svg>
