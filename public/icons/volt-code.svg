<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Lightning bolt merged with code brackets">
  <style>
    .bolt { transform-box: fill-box; transform-origin: center; animation: bolt-pulse 2.2s cubic-bezier(.22,1,.36,1) infinite; }
    .bracket-l { transform-box: fill-box; transform-origin: center; animation: wiggle-l 2.8s cubic-bezier(.22,1,.36,1) infinite; }
    .bracket-r { transform-box: fill-box; transform-origin: center; animation: wiggle-r 2.8s cubic-bezier(.22,1,.36,1) infinite; }
    .sparkle { transform-box: fill-box; transform-origin: center; animation: sparkle 1.8s ease-in-out infinite; }
    .sparkle.s2 { animation-delay: .5s; }
    .sparkle.s3 { animation-delay: 1s; }
    @keyframes bolt-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    @keyframes wiggle-l {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    @keyframes wiggle-r {
      0%, 100% { transform: rotate(5deg); }
      50% { transform: rotate(-5deg); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(25deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .bolt, .bracket-l, .bracket-r, .sparkle { animation: none; }
    }
  </style>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#FFF6EC" stroke="#221D2E" stroke-width="1.5"/>
  <path d="M 37 13 L 25 35 L 33 35 L 29 57 L 45 29 L 36 29 L 41 13 Z" fill="#FF5C7A"/>
  <g class="bolt">
    <path d="M 34 10 L 22 32 L 30 32 L 26 54 L 42 26 L 33 26 L 38 10 Z" fill="#FFC95C" stroke="#221D2E" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g class="bracket-l">
    <path d="M 15 17 L 8 26 L 15 35" fill="none" stroke="#221D2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="bracket-r">
    <path d="M 49 17 L 56 26 L 49 35" fill="none" stroke="#221D2E" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path class="sparkle" d="M 53 8 L 54.3 10.7 L 57 12 L 54.3 13.3 L 53 16 L 51.7 13.3 L 49 12 L 51.7 10.7 Z" fill="#FF5C7A"/>
  <path class="sparkle s2" d="M 7 42 L 8.2 44.2 L 10.5 45.5 L 8.2 46.8 L 7 49 L 5.8 46.8 L 3.5 45.5 L 5.8 44.2 Z" fill="#8B7CFF"/>
  <path class="sparkle s3" d="M 52 44 L 53.2 46.2 L 55.5 47.5 L 53.2 48.8 L 52 51 L 50.8 48.8 L 48.5 47.5 L 50.8 46.2 Z" fill="#3FC7A9"/>
</svg>
