<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hydroelectric turbine with spinning rotor and falling water drops">
  <style>
    .rotor { transform-origin: 32px 36px; animation: spin 5s linear infinite; }
    .orbit { transform-origin: 32px 36px; animation: spin 16s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .drop { transform-box: fill-box; transform-origin: center; animation: drop-fall 2.2s cubic-bezier(.22,1,.36,1) infinite; }
    .drop.d2 { animation-delay: .7s; }
    .drop.d3 { animation-delay: 1.4s; }
    @keyframes drop-fall {
      0% { transform: translateY(-3px); opacity: 0; }
      20% { opacity: 1; }
      75% { opacity: 1; }
      100% { transform: translateY(11px); opacity: 0; }
    }
    .bolt { transform-box: fill-box; transform-origin: center; animation: bolt-pulse 1.6s cubic-bezier(.22,1,.36,1) infinite; }
    @keyframes bolt-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: .7; }
    }
    .sparkle { transform-box: fill-box; transform-origin: center; animation: sparkle 2.4s ease-in-out infinite; }
    .sparkle.s2 { animation-delay: 1.2s; }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(.4) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(20deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rotor, .orbit, .drop, .bolt, .sparkle { animation: none; }
    }
  </style>
  <rect x="4.5" y="4.5" width="61" height="61" rx="14" fill="#221D2E"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14" fill="#FFF6EC" stroke="#221D2E" stroke-width="1.5"/>
  <g transform="rotate(-2 32 32)">
    <path class="sparkle" d="M11 8 L12.3 10.7 L15 12 L12.3 13.3 L11 16 L9.7 13.3 L7 12 L9.7 10.7 Z" fill="#8B7CFF"/>
    <path class="sparkle s2" d="M55 42 L56.3 44.7 L59 46 L56.3 47.3 L55 50 L53.7 47.3 L51 46 L53.7 44.7 Z" fill="#FF5C7A"/>
    <g transform="translate(18 9)"><g class="drop"><path d="M0 -3 C1.2 -1.2 1.8 0 1.8 1.6 A1.8 1.8 0 1 1 -1.8 1.6 C-1.8 0 -1.2 -1.2 0 -3 Z" fill="#8B7CFF" stroke="#221D2E" stroke-width="1.2"/></g></g>
    <g transform="translate(32 8)"><g class="drop d2"><path d="M0 -3 C1.2 -1.2 1.8 0 1.8 1.6 A1.8 1.8 0 1 1 -1.8 1.6 C-1.8 0 -1.2 -1.2 0 -3 Z" fill="#8B7CFF" stroke="#221D2E" stroke-width="1.2"/></g></g>
    <g transform="translate(46 9)"><g class="drop d3"><path d="M0 -3 C1.2 -1.2 1.8 0 1.8 1.6 A1.8 1.8 0 1 1 -1.8 1.6 C-1.8 0 -1.2 -1.2 0 -3 Z" fill="#8B7CFF" stroke="#221D2E" stroke-width="1.2"/></g></g>
    <circle class="orbit" cx="32" cy="36" r="18.5" fill="none" stroke="#574E63" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="32" cy="36" r="15" fill="#3FC7A9" stroke="#221D2E" stroke-width="2"/>
    <circle cx="32" cy="36" r="11.5" fill="#FFF6EC" stroke="#221D2E" stroke-width="1.5"/>
    <g class="rotor">
      <rect x="30" y="25" width="4" height="12" rx="2" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5"/>
      <rect x="30" y="25" width="4" height="12" rx="2" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5" transform="rotate(60 32 36)"/>
      <rect x="30" y="25" width="4" height="12" rx="2" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5" transform="rotate(120 32 36)"/>
      <rect x="30" y="25" width="4" height="12" rx="2" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5" transform="rotate(180 32 36)"/>
      <rect x="30" y="25" width="4" height="12" rx="2" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5" transform="rotate(240 32 36)"/>
      <rect x="30" y="25" width="4" height="12" rx="2" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5" transform="rotate(300 32 36)"/>
    </g>
    <circle cx="32" cy="36" r="3.5" fill="#FF5C7A" stroke="#221D2E" stroke-width="1.5"/>
    <g transform="translate(53 14)"><g class="bolt"><path d="M3 -7 L-4 1 L-0.5 1 L-2.5 7 L5 -3 L1 -3 Z" fill="#FFC95C" stroke="#221D2E" stroke-width="1.5" stroke-linejoin="round"/></g></g>
    <path d="M13 56 Q18 53.5 23 56 T33 56 T43 56 T53 56" fill="none" stroke="#8B7CFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
